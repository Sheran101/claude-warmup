name: Claude session warmup

on:
  # Triggered at exact times by cron-job.org via the workflow_dispatch API
  # (05:30, 10:35, 15:40, 20:45 Sri Lanka time). GitHub's own schedule was dropped
  # because it ran 20 min to 17 hours late. Also runnable by hand.
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Start Claude session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "hi" --model haiku
